[workspace]
members = ["test-programs", "test-programs/artifacts"]

[workspace.package]
version = "51.0.0"
authors = ["The Wasmtime Project Developers"]
edition = "2024"
# Mirrors Wasmtime's policy: no larger than current stable Rust minus 2.
rust-version = "1.97.0"

[workspace.lints.rust]
unused_extern_crates = 'warn'
trivial_numeric_casts = 'warn'
unstable_features = 'warn'
unused_import_braces = 'warn'

[workspace.dependencies]
# Wasmtime crates come from crates.io now that wasi-nn lives out-of-tree. These
# are pinned to the release this repository was extracted from; bump them
# together when moving to a new Wasmtime release.
wasmtime = { version = "=51.0.0-rc.1", default-features = false }
wasmtime-wasi = { version = "=51.0.0-rc.1", default-features = false }
wiggle = { version = "=51.0.0-rc.1", default-features = false }

tracing = { version = "0.1.41", default-features = false }
thiserror = "2.0.17"
walkdir = "2.5.0"
libtest-mimic = "0.8.1"
tracing-subscriber = { version = "0.3.20", default-features = false, features = [
    'fmt',
    'env-filter',
    'ansi',
    'tracing-log',
] }
anyhow = { version = "1.0.103", default-features = false }
test-programs-artifacts = { path = 'test-programs/artifacts' }

# Guest-side and componentization tooling for the test programs.
wasi-nn = "0.6.0"
wit-bindgen = { version = "0.63.0", default-features = false }
wit-component = "0.263.0"
wasi-preview1-component-adapter-provider = "50.0.1"
heck = "0.5"

[package]
name = "wasmtime-wasi-nn"
version.workspace = true
authors.workspace = true
description = "Wasmtime implementation of the wasi-nn API"
documentation = "https://docs.rs/wasmtime-wasi-nn"
license = "Apache-2.0 WITH LLVM-exception"
categories = ["wasm", "computer-vision"]
keywords = ["webassembly", "wasm", "neural-network"]
repository = "https://github.com/bytecodealliance/wasmtime-wasi-nn"
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
# These dependencies are necessary for the WITX-generation macros to work:
wiggle = { workspace = true, features = ["wasmtime"] }

# This dependency is necessary for the WIT-generation macros to work:
wasmtime = { workspace = true, features = [
    "component-model",
    "runtime",
    "std",
] }

# These dependencies are necessary for the wasi-nn implementation:
tracing = { workspace = true }
thiserror = { workspace = true }

ort = { version = "2.0.0-rc.10", default-features = false, features = [
    "copy-dylibs",
    "half",
], optional = true }
half = { version = "2.4.1", optional = true }
tch = { version = "0.17.0", default-features = false, optional = true}

[target.'cfg(target_pointer_width = "64")'.dependencies]
openvino = { version = "0.11.0", features = [
    "runtime-linking",
], optional = true }

[target.'cfg(windows)'.dependencies.windows]
version = "0.52"
features = [
    "AI_MachineLearning",
    "Storage_Streams",
    "Foundation_Collections",
    # For getting IVectorView<i64> from tensor.dimensions.
    "implement",
]
optional = true

[build-dependencies]
walkdir = { workspace = true }

[dev-dependencies]
libtest-mimic = { workspace = true }
test-programs-artifacts = { workspace = true }
wasmtime-wasi = { workspace = true, features = ["p1"] }
wasmtime = { workspace = true, features = ["cranelift", "wat"] }
tracing-subscriber = { workspace = true }

[features]
default = ["openvino", "winml"]
# OpenVINO is available on all platforms; it requires OpenVINO to be installed.
openvino = ["dep:openvino"]
# ONNX is available on all platforms.
onnx = ["dep:ort", "dep:half"]
# Use prebuilt ONNX Runtime binaries from ort.
onnx-download = ["onnx", "ort/download-binaries"]
# CUDA execution provider for NVIDIA GPU support (requires CUDA toolkit)
onnx-cuda = ["onnx", "ort/cuda"]
# Enable tracing for ONNX Runtime
ort-tracing = ["onnx", "ort/tracing"]
# WinML is only available on Windows 10 1809 and later.
winml = ["dep:windows"]
# PyTorch is available on all platforms; requires Libtorch to be installed
pytorch = ["dep:tch"]

[[test]]
name = "test-programs"
harness = false
